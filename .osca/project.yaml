# OSCA project configuration (hand-maintained). Generated from the copier template;
# run `uvx copier update` to pick up template changes.
schema: osca/v1
project: nautilus-trader
name: NautilusTrader
osca_version: ">=0.3,<0.4"

upstream:
  remote: upstream
  repository: https://github.com/nautechsystems/nautilus_trader
  branch: develop
  track: tags
  tag_pattern: '^v\d+\.\d+\.\d+$'
  mirror_branch: mirror/develop

study:
  branch: study/zh-CN
  language: zh-CN
  strategy: inline-comments
  marker: "【zh】"
  # Files regenerated by build scripts (cbindgen renders Rust doc comments into them).
  # They must stay byte-identical to upstream; restore them after a local `--features ffi` build.
  generated:
    - nautilus_trader/core/includes/*.h
    - nautilus_trader/core/rust/*.pxd

license: LGPL-3.0

scope:
  # Which symbols count towards coverage (impl blocks are indexed but not counted).
  symbols:
    min_body_lines: 5
    exclude_kinds: [impl]
  include:
    - "crates/core/**"
    - "crates/common/**"
    - "crates/model/**"
    - "crates/data/**"
    - "crates/execution/**"
    - "crates/risk/**"
    - "crates/portfolio/**"
    - "crates/trading/**"
    - "crates/backtest/**"
    - "crates/system/**"
    - "crates/live/**"
    - "crates/network/**"
    - "crates/persistence/**"
    - "crates/indicators/**"
    - "crates/analysis/**"
    - "nautilus_trader/**"
    - "python/nautilus_trader/**"
  exclude:
    - "**/tests/**"
    - "**/tests.rs"
    - "**/benches/**"
    - "crates/*/src/python/**"
    - "crates/*/src/ffi/**"
    - "**/*.pyi"

terminology: [general, rust, python, trading, distributed-systems]

atlas:
  repo: dajy5120/opensource-code-atlas
  ref: main

# `osca translate` (structured annotation patches, ADR 0005)
ai:
  backend: claude-code     # claude-code = subscription via `claude -p`; api = ANTHROPIC_API_KEY
  model: claude-sonnet-5-5
  effort: medium            # low | medium | high | xhigh | max
  max_symbols_per_request: 20
  fallbacks: true           # server-side refusal fallback (not used for batches)

build:
  check: "cargo check --workspace --all-features"
  doc: "cargo doc --workspace --no-deps"
