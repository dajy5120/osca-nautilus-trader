name: osca-site
# Build the Chinese source-reading site and publish it with GitHub Pages.
on:
  push:
    branches: [study/zh-CN]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install osca
        run: uv tool install "git+https://github.com/dajy5120/opensource-code-atlas@main#subdirectory=tools/osca"
      - name: Build site
        run: osca site build --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
